<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Montserrat,sans-serif;background:#fff;color:#18233a;position:relative}
.mast{background:#2a3d5e;color:#fff;padding:104px 20px 28px;position:relative;overflow:hidden}
.ring{position:absolute;right:-70px;top:40px;width:210px;height:210px;border:34px solid rgba(255,255,255,.07);border-radius:50%}
h1{font-size:40px;line-height:1.02;letter-spacing:-.03em;margin-bottom:10px}
.note{color:#d5c9b7;font-weight:600;font-size:15px}
.status{height:44px;position:absolute;top:0;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600;font-size:15px}
.sec{padding:22px 20px 0}
.sec h2{font-size:20px;letter-spacing:-.015em;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;min-height:56px;border-top:1px solid rgba(42,61,94,.12)}
.tile{width:34px;height:34px;border-radius:10px;background:#f4efe7;flex:none}
.rt{font-weight:600;font-size:15.5px}.rs{font-size:14px;color:#6b7384}
.slip{position:absolute;left:12px;right:12px;bottom:95px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgb(24 35 58/.06),0 10px 24px -14px rgb(24 35 58/.3),0 0 0 1px rgba(42,61,94,.12);padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center}
.slip .t{width:40px;height:40px;border-radius:10px;background:rgba(231,174,116,.3);flex:none;display:grid;place-items:center;color:#8a5422;font-weight:700}
.slip .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a5422}
.slip .h{font-weight:700;font-size:15.5px;line-height:1.25}
.slip .go{margin-left:auto;height:36px;border-radius:18px;padding:0 14px;background:#2a3d5e;color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;flex:none}
.slip .x{width:32px;height:32px;border-radius:50%;background:#f4efe7;flex:none;display:grid;place-items:center;color:#545e70;font-size:14px}
.tabs{position:absolute;bottom:0;left:0;right:0;height:83px;border-top:1px solid rgba(42,61,94,.12);display:grid;grid-template-columns:repeat(4,1fr);padding-top:8px;background:rgba(255,255,255,.92)}
.tab{text-align:center;font-size:11px;font-weight:600;color:#6b7384}.tab i{display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:6px;background:currentColor;opacity:.5}
.tab.on{color:#00776d}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<header class="mast"><div class="ring"></div><h1>Home</h1><p class="note">Sunday 9 November · Job 33:4</p></header>
<section class="sec">
  <h2>This Sunday</h2>
  <div class="row"><span class="tile"></span><div><div class="rt">10:30am Worship</div><div class="rs">Job 33:1–7 · streamed on YouTube</div></div></div>
  <div class="row"><span class="tile"></span><div><div class="rt">6pm Worship</div><div class="rs">Evening service</div></div></div>
  <div class="row"><span class="tile"></span><div><div class="rt">Bulletin</div><div class="rs">What's Next, 9 November</div></div></div>
  <div class="row"><span class="tile"></span><div><div class="rt">Wednesday 7pm</div><div class="rs">Bible study and prayer</div></div></div>
</section>
<div class="slip">
  <span class="t">★</span>
  <div><div class="k">New · 2 things</div><div class="h">Sign in with your phone</div></div>
  <span class="go">Show me</span><span class="x">✕</span>
</div>
<nav class="tabs"><div class="tab on"><i></i>Home</div><div class="tab"><i></i>Listen</div><div class="tab"><i></i>Prayer</div><div class="tab"><i></i>More</div></nav>
</body></html>
