<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Montserrat,sans-serif;background:#fff;color:#18233a;position:relative}
.mast{background:#2a3d5e;color:#fff;padding:104px 20px 26px;position:relative;overflow:hidden}
.ring{position:absolute;right:-70px;top:40px;width:210px;height:210px;border:34px solid rgba(255,255,255,.07);border-radius:50%}
.kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e7ae74;display:flex;gap:8px;align-items:center}
.kick i{width:8px;height:8px;border-radius:50%;background:#e7ae74;display:inline-block}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;margin:12px 0 10px;max-width:13ch}
.note{color:#d5c9b7;font-weight:600;font-size:16px;line-height:1.4;max-width:30ch}
.acts{display:flex;gap:10px;margin-top:20px;align-items:center}
.b{height:44px;border-radius:22px;padding:0 18px;display:flex;align-items:center;font-weight:600;font-size:15px}
.b1{background:#fff;color:#2a3d5e}.b2{background:rgba(255,255,255,.12);color:#fff}
.dots{margin-left:auto;display:flex;gap:6px}.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.dots span.on{background:#fff}
.top{position:absolute;top:0;left:0;right:0;height:92px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 12px 6px;color:#fff;z-index:2}
.bell{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.status{height:44px;position:absolute;top:0;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600;font-size:15px;z-index:3}
.sec{padding:22px 20px 0}
.sec h2{font-size:20px;letter-spacing:-.015em;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;min-height:56px;border-top:1px solid rgba(42,61,94,.12)}
.tile{width:34px;height:34px;border-radius:10px;background:#f4efe7}
.rt{font-weight:600;font-size:15.5px}.rs{font-size:14px;color:#6b7384}
.tabs{position:absolute;bottom:0;left:0;right:0;height:83px;border-top:1px solid rgba(42,61,94,.12);display:grid;grid-template-columns:repeat(4,1fr);padding-top:8px;background:rgba(255,255,255,.92)}
.tab{text-align:center;font-size:11px;font-weight:600;color:#6b7384}.tab i{display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:6px;background:currentColor;opacity:.5}
.tab.on{color:#00776d}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div class="top"><span></span><span class="bell"></span></div>
<header class="mast">
  <div class="ring"></div>
  <div class="kick"><i></i>New in this update · 1 of 2</div>
  <h1>Sign in with your phone</h1>
  <p class="note">Use Face ID or Touch ID to sign in. No passwords to remember.</p>
  <div class="acts">
    <span class="b b1">Show me</span><span class="b b2">Not now</span>
    <span class="dots"><span class="on"></span><span></span></span>
  </div>
</header>
<section class="sec">
  <h2>This Sunday</h2>
  <div class="row"><span class="tile"></span><div><div class="rt">10:30am Worship</div><div class="rs">Job 33:1–7 · streamed on YouTube</div></div></div>
  <div class="row"><span class="tile"></span><div><div class="rt">6pm Worship</div><div class="rs">Evening service</div></div></div>
  <div class="row"><span class="tile"></span><div><div class="rt">Bulletin</div><div class="rs">What's Next, 9 November</div></div></div>
</section>
<nav class="tabs"><div class="tab on"><i></i>Home</div><div class="tab"><i></i>Listen</div><div class="tab"><i></i>Prayer</div><div class="tab"><i></i>More</div></nav>
</body></html>
