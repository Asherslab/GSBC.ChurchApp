<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><title>Outreach, patch board</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2a3d5e;--ink:#18233a;--ink2:#545e70;--ink3:#6b7384;--paper:#fff;--beige:#d5c9b7;--sand:#f4efe7;--aqua:#009c8f;--aqua-deep:#00776d;--orange:#e7ae74;--orange-ink:#8a5422;--line:rgba(42,61,94,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--paper);font-family:Montserrat,sans-serif;color:var(--ink);position:relative}
.status{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;color:#fff;font-size:16px;font-weight:600}
.status svg{height:12px;fill:#fff}
.mast{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding-bottom:18px}
.mast .ring{position:absolute;right:-70px;top:10px;width:190px;height:190px;border-radius:50%;border:16px solid rgba(255,255,255,.06)}
.head{display:grid;grid-template-columns:32px 1fr;column-gap:6px;align-items:center;padding:6px 20px 0 12px}
.back{width:32px;height:32px;display:grid;place-items:center}
.back svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kick{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--beige)}
.mast h1{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.prog{padding:10px 20px 0 50px}
.prog p{font-size:13px;color:rgba(255,255,255,.82);display:flex;justify-content:space-between}
.prog p b{font-weight:600;color:#fff}
.track{height:4px;border-radius:2px;background:rgba(255,255,255,.16);margin-top:8px}
.track i{display:block;height:4px;width:14.6%;border-radius:2px;background:var(--orange)}
.map{position:absolute;top:150px;left:0;width:390px;height:380px;background:#efebe3}
.map svg{display:block}
.legend{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(24,35,58,.14);font-size:11.5px;font-weight:600;color:var(--ink)}
.sw{width:12px;height:12px;border-radius:3px}
.sw.f{background:rgba(0,156,143,.28);border:1px solid rgba(0,156,143,.5)}
.sw.c{border:1.5px dashed var(--orange);background:rgba(231,174,116,.18)}
.sw.d{background:rgba(42,61,94,.55)}
.locate{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:18px;background:#fff;box-shadow:0 1px 3px rgba(24,35,58,.18);display:grid;place-items:center}
.locate svg{width:18px;height:18px;fill:none;stroke:var(--aqua-deep);stroke-width:2;stroke-linecap:round}
.sheet{position:absolute;left:0;right:0;top:506px;bottom:84px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(24,35,58,.14);padding:8px 20px 0}
.grab{width:38px;height:5px;border-radius:3px;background:#d9dde4;margin:0 auto 12px}
.sheet .kick{color:var(--aqua-deep)}
.sheet h2{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.25;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1.35fr;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:10px 0 10px 12px;border-left:1px solid var(--line)}
.stats div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.stats small{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.note{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:13px;color:var(--ink2)}
.note i{width:8px;height:8px;border-radius:50%;background:var(--aqua)}
.note b{font-weight:600;color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.btn{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:600}
.btn.p{background:var(--aqua-deep);color:#fff}
.btn.q{background:var(--sand);color:var(--navy);padding:0 18px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-top:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink3)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--aqua-deep)}
</style></head><body>
