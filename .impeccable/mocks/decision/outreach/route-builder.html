<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><title>Plan a walk</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2a3d5e;--ink:#18233a;--ink2:#545e70;--ink3:#6b7384;--sand:#f4efe7;--sand2:#e9e1d4;--beige:#d5c9b7;--aqua:#009c8f;--aquad:#00776d;--orange:#e7ae74;--line:rgba(42,61,94,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#eef0ea;font-family:Montserrat,sans-serif;color:var(--ink);position:relative}
.map{position:absolute;inset:0}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-size:16px;font-weight:600;color:var(--ink)}
.status svg{height:12px}
.top{position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(24,35,58,.16)}
.back svg{width:20px;height:20px;fill:none;stroke:var(--navy);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill{height:36px;padding:0 16px;border-radius:18px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;letter-spacing:-.01em;box-shadow:0 2px 10px rgba(24,35,58,.2)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:384px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(24,35,58,.12);padding:8px 20px 0}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sand2);margin:0 auto 14px}
.lab{font-size:13px;font-weight:600;color:var(--ink2)}
.from{display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);width:236px;height:36px;padding:3px;border-radius:12px;background:var(--sand)}
.seg span{display:grid;place-items:center;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(24,35,58,.14)}
.addr{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600}
.addr svg{width:16px;height:16px;flex:none}
.addr a{margin-left:auto;font-size:13px;color:var(--aquad)}
.dist{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.step{display:flex;align-items:center;gap:14px}
.rb{width:40px;height:40px;border-radius:50%;background:var(--sand);display:grid;place-items:center}
.rb svg{width:16px;height:16px;stroke:var(--navy);stroke-width:2.4;stroke-linecap:round}
.km{font-size:30px;font-weight:700;letter-spacing:-.03em;min-width:92px;text-align:center}
.km small{font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:3px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:14px;background:var(--sand);border-radius:14px;padding:12px 0}
.stats div{padding:0 14px;border-left:1px solid var(--line)}
.stats div:first-child{border:0}
.stats b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.stats small{font-size:12px;color:var(--ink2)}
.note{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:12.5px;color:var(--ink2)}
.note i{width:16px;height:0;border-top:2.5px dashed #9aa1ad}
.go{margin-top:14px;height:52px;border-radius:14px;background:#00877c;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.go svg{width:18px;height:18px;fill:#fff}
.quiet{height:42px;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--navy)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style></head><body>

</svg>
