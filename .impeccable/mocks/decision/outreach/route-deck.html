<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><title>Walks near you</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2a3d5e;--ink:#18233a;--ink2:#545e70;--ink3:#6b7384;--paper:#fff;--beige:#d5c9b7;--sand:#f4efe7;--sand2:#e9e1d4;--aqua:#009c8f;--aqua-deep:#00776d;--orange:#e7ae74;--orange-ink:#8a5422;--line:rgba(42,61,94,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--paper);font-family:Montserrat,sans-serif;color:var(--ink);position:relative}
.status{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600}
.status svg{height:12px;fill:var(--ink)}
.bar{height:48px;display:flex;align-items:center;gap:4px;padding:0 16px 0 8px}
.back{width:36px;height:36px;display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px;fill:none;stroke:var(--navy);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar h1{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.on{margin-left:auto;height:30px;padding:0 12px;border-radius:15px;background:var(--sand);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.on i{width:7px;height:7px;border-radius:50%;background:var(--aqua);box-shadow:0 0 0 3px rgba(0,156,143,.2)}
.chips{display:flex;gap:8px;padding:8px 16px 0}
.chip{height:36px;padding:0 16px;border-radius:18px;background:var(--sand);display:inline-flex;align-items:center;font-size:14px;font-weight:600;color:var(--ink2)}
.chip.sel{background:var(--navy);color:#fff}
.deck{position:absolute;top:151px;left:0;right:0;height:618px}
.card{position:absolute;top:0;left:16px;width:340px;height:618px;border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(24,35,58,.06),0 8px 28px rgba(24,35,58,.11)}
.card.next{left:366px;top:14px;height:590px;box-shadow:0 6px 20px rgba(24,35,58,.08)}
.card.next .map{background:#efebe3}
.map{height:334px;background:#eef0ea;position:relative}
.map svg{display:block}
.body{padding:18px 18px 18px}
.body h2{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.streets{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.4}
.stats{display:grid;grid-template-columns:1fr 1.2fr 1fr;margin-top:14px;background:var(--sand);border-radius:14px;padding:12px 0}
.stats div{padding:0 12px;white-space:nowrap;border-left:1px solid var(--line)}
.stats div:first-child{border:0}
.stats b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:var(--ink2)}
.counts{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;background:rgba(0,156,143,.14);color:var(--aqua-deep);font-size:12.5px;font-weight:600;margin-top:12px}
.counts svg{width:14px;height:14px;fill:none;stroke:var(--aqua-deep);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;gap:10px;margin-top:14px}
.go{flex:1;height:52px;border-radius:14px;background:var(--aqua-deep);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.go svg{width:16px;height:16px;fill:#fff}
.save{width:52px;height:52px;border-radius:50%;background:var(--sand);display:grid;place-items:center;flex:none}
.save svg{width:20px;height:20px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linejoin:round}
.dots{position:absolute;top:785px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--sand2)}
.dots i:first-child{width:20px;background:var(--navy)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style></head><body>

    <div class="body">
