<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><title>Outreach, one map</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2a3d5e;--ink:#18233a;--ink2:#545e70;--ink3:#6b7384;--sand:#f4efe7;--sand2:#e9e1d4;--beige:#d5c9b7;--aqua:#009c8f;--aquad:#00776d;--orange:#e7ae74;--orange-ink:#5c3712;--line:rgba(42,61,94,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#eef0ea;font-family:Montserrat,sans-serif;color:var(--ink);position:relative}
.map{position:absolute;inset:0}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-size:16px;font-weight:600;color:var(--ink)}
.status svg{height:12px}
.top{position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(24,35,58,.16)}
.back svg{width:20px;height:20px;fill:none;stroke:var(--navy);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill{height:36px;padding:0 16px;border-radius:18px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;letter-spacing:-.01em;box-shadow:0 2px 10px rgba(24,35,58,.2)}
.legend{position:absolute;top:112px;left:16px;display:flex;gap:6px}
.chipm{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(24,35,58,.14);font-size:11.5px;font-weight:600;color:var(--ink)}
.sw{width:12px;height:12px;border-radius:3px}
.sw.f{background:rgba(0,156,143,.22);border:1px solid rgba(0,156,143,.5)}
.sw.d{background:#d3d6dc;border:1px solid #b4b9c2}
.sheet{position:absolute;left:0;right:0;bottom:0;height:406px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(24,35,58,.14);padding:8px 20px 0}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sand2);margin:0 auto 12px}
.seg{display:grid;grid-template-columns:1.12fr .82fr 1.2fr;height:40px;padding:3px;border-radius:12px;background:var(--sand)}
.seg span{display:flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.badge{height:17px;padding:0 6px;border-radius:9px;background:var(--orange);color:var(--orange-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center}
h2{font-size:17px;font-weight:700;letter-spacing:-.015em;margin-top:18px}
.chips{display:flex;gap:8px;margin-top:10px}
.chip{height:36px;padding:0 15px;border-radius:18px;background:var(--sand);color:var(--ink2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);color:#fff}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.stats{display:grid;grid-template-columns:1fr 1.1fr 1.1fr;margin-top:14px;background:var(--sand);border-radius:14px;padding:12px 0}
.stats div{padding:0 14px;border-left:1px solid var(--line)}
.stats div:first-child{border:0}
.stats b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.stats small{font-size:12px;color:var(--ink2)}
.note{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)}
.note i{width:16px;height:0;border-top:2.5px dashed #9aa1ad}
.note b{font-weight:600;color:var(--ink)}
.go{margin-top:14px;height:52px;border-radius:14px;background:var(--aquad);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.go svg{width:18px;height:18px;fill:#fff}
.quiet{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:var(--navy)}
.quiet span{font-weight:400;color:var(--ink3)}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style></head><body>

</svg>
<div class="status"><span>9:41</span><svg viewBox="0 0 66 12" fill="#18233a"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M30 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM32.6 6.4a5 5 0 0 1 6.8 0L36 10z"/><rect x="45.5" y=".5" width="18" height="11" rx="3" fill="none" stroke="#18233a" opacity=".45"/><rect x="47.5" y="2.5" width="13" height="7" rx="1.5"/><rect x="64.5" y="4" width="1.5" height="4" rx=".7" opacity=".45"/></svg></div>
<div class="top">
  <div class="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="pill">Outreach</div>
</div>
<div class="legend"><span class="chipm"><i class="sw f"></i>Fresh</span><span class="chipm"><i class="sw d"></i>Done this week</span></div>
<section class="sheet">
  <div class="grab"></div>
  <div class="seg"><span class="on">From my door</span><span>Patches</span><span>Outreach day<em class="badge">Sat</em></span></div>
  <h2>How long have you got?</h2>
  <div class="chips">
    <span class="chip">30 min</span><span class="chip on">1 hr</span><span class="chip">2 hr</span>
    <span class="chip"><svg viewBox="0 0 16 16"><path d="M2 12h12M4 9v3M8 7v5M12 9v3"/></svg>Distance</span>
  </div>
  <div class="stats">
    <div><b>2.8 km</b><small>loop, about 1 hr</small></div>

    <div><b>2 + spare</b><small>bundles of 50</small></div>
  </div>
  <div class="note"><i></i>Avoids <b>3 streets</b> done this week</div>
  <div class="go"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Start walk</div>

</body></html>
