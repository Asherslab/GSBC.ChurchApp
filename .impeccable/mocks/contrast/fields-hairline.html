:root {

.icon { width: 24px; height: 24px; flex: none; stroke-width: 1.75; }

.row__unread { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: var(--radius-full); background: var(--marker); vertical-align: 0.08em; }

.row--unread .row__unread { position: absolute; top: 0.42em; left: 0; margin: 0; }

.masthead {

.list { border-top: 1px solid var(--line); }

.row--reading { align-items: flex-start; padding: 22px 0; }

.text-link { display: inline-flex; align-items: center; gap: 2px; min-height: var(--touch); font-size: var(--text-label); font-weight: 600; color: var(--accent); text-decoration: none; }
button.text-link { padding: 0; border: 0; background: none; font-family: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }

.pull { position: relative; --pull: 0px; --pull-n: 0; }
.pull__content { transform: translateY(var(--pull)); transition: transform 280ms var(--ease-out); }
.pull.is-pulling .pull__content { transition: none; }
.pull__indicator {
  position: absolute;
  top: calc(var(--sat) + var(--top-h) - 30px);
  left: 50%;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  margin-left: -16px;
  border-radius: var(--radius-full);
  color: var(--on-masthead);
  opacity: min(1, calc(var(--pull-n) / 72));
  transform: translateY(calc(var(--pull) * 0.5)) rotate(calc(var(--pull-n) * 3deg));
  transition: opacity 200ms, transform 280ms var(--ease-out);
}
.pull.is-pulling .pull__indicator { transition: none; }
.pull.is-ready .pull__indicator { background: var(--masthead-chip); }

@keyframes spin { to { transform: rotate(360deg); } }

.sheet-layer { position: fixed; inset: 0; width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; padding: 0; border: 0; background: none; color: inherit; overflow: visible; }
.sheet-layer::backdrop { background: transparent; }
.sheet-layer:not([open]) { display: block; }
.sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: var(--scrim); animation: fade 200ms both; }
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 51;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10px var(--gutter) calc(var(--sab) + 20px);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  background: var(--page);
  color: var(--ink);
  animation: sheet-up 320ms var(--ease-out) both;
}
.sheet:focus { outline: none; }
.sheet__grabber { width: 38px; height: 5px; margin: 0 auto 16px; border-radius: var(--radius-full); background: var(--line); }
.sheet__title { margin: 0; font-size: var(--text-title-lg); font-weight: 700; letter-spacing: -0.02em; }
.sheet__lead { margin: 6px 0 0; max-width: 65ch; color: var(--ink-2); }
.sheet__body { display: grid; gap: var(--stack); margin-top: 18px; }
.sheet__actions { display: grid; gap: 10px; margin-top: 22px; }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; bottom: 50%; width: min(560px, 100% - 48px); border-radius: var(--radius-sheet); transform: translate(-50%, 50%); animation-name: fade; }
  .sheet:not(.sheet--cover) > .sheet__grabber { visibility: hidden; height: 0; margin-bottom: 8px; }
}
@keyframes sheet-up { from { transform: translateY(100%); } }
.sheet--cover { padding-top: 0; }
.sheet__cover {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  margin: 0 calc(-1 * var(--gutter));
  padding: 10px var(--gutter) 24px;
  background: var(--masthead);
  color: var(--on-masthead);
}
.sheet__cover .sheet__grabber { background: var(--masthead-chip); margin-bottom: 22px; }
.sheet__mark { position: absolute; right: -44px; top: -18px; width: 180px; opacity: 0.07; z-index: -1; pointer-events: none; }

.sheet-heading { display: flex; align-items: flex-start; gap: 14px; padding-right: 36px; }
.sheet-heading__icon { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: var(--radius-field); background: var(--masthead-chip); color: var(--on-masthead); }
.sheet-heading__title { margin: 0; font-size: var(--text-headline); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; align-self: center; }
.sheet-heading__note { margin: 10px 0 0 58px; font-size: var(--text-label); font-weight: 600; color: var(--masthead-note); text-wrap: balance; }
.sheet__summary { margin: 4px 0 0; max-width: 65ch; font-size: var(--text-lead); line-height: 1.55; color: var(--ink); text-wrap: pretty; }
.sheet__step { display: grid; gap: var(--stack); }
.sheet__next { animation: paged-in 260ms var(--ease-out) both; }
.sheet .section { margin-top: 0; padding-inline: 0; }
.paged__cover, .paged__page { touch-action: pan-y; }
.paged__cover.paged--forward, .paged__page.paged--forward { animation: paged-in 260ms var(--ease-out) both; }

.paged__dot::before { content: ""; display: block; width: 8px; height: 8px; margin: auto; border-radius: var(--radius-full); background: var(--line); transition: width 240ms var(--ease-out), background-color 240ms var(--ease-out); }
.paged__dot.is-current::before { width: 20px; background: var(--marker); }
@keyframes paged-in { from { opacity: 0; transform: translateX(14px); } }
@keyframes paged-back { from { opacity: 0; transform: translateX(-14px); } }

.facts { display: grid; gap: 0; margin: 0; }
.fact { display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.fact__icon { grid-row: span 2; display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-tile); background: var(--sand); color: var(--primary); }

.fact__label { font-size: var(--text-caption); font-weight: 600; color: var(--ink-3); }

@keyframes fade { from { opacity: 0; } }

.empty { display: grid; justify-items: center; gap: 8px; padding: 32px 24px; text-align: center; color: var(--ink-2); }

.date-line { font-variant-numeric: tabular-nums; }

.sync { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-caption); font-weight: 600; color: var(--ink-2); }

.btn {

  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--touch);

.toggle-chips { display: flex; gap: 8px; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }

.toggle-chips--quiet { gap: 6px; }
.toggle-chips--quiet .filter-chip { min-height: 32px; padding: 0 12px; background: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink-3) 45%, transparent); color: var(--ink-2); }

.add-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--touch); padding: 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font: inherit; font-size: var(--text-label); font-weight: 600; text-align: left; cursor: pointer; }
.add-row:hover { color: var(--ink); }
.file-pick--busy { color: var(--ink-3); cursor: progress; }
.picture-field__waiting { color: var(--ink-3); font-size: var(--text-label); }

.picture-field__chosen { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px; }
.picture-field__preview { flex: 0 1 240px; min-width: 160px; border-radius: var(--radius-field); }

.count-capsule { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-full); background: var(--marker); color: var(--on-marker); font-size: var(--text-pill); font-weight: 700; font-variant-numeric: tabular-nums; }

.switch--small span { width: 36px; height: 22px; }

.topbar__text-btn { min-height: var(--touch); padding: 0 12px; border: 0; background: none; color: var(--on-masthead); font: inherit; font-size: var(--text-body); font-weight: 600; cursor: pointer; }

.swipe-pages { overflow: hidden; touch-action: pan-y; }

.swipe-pages__page--before, .swipe-pages__page--after { position: absolute; top: 0; width: 100%; }
.swipe-pages__page--before { right: 100%; }
.swipe-pages__page--after { left: 100%; }

.role-tick { display: flex; align-items: center; gap: 2px; min-height: 40px; border-radius: var(--radius-field); }
.role-tick__label { display: flex; flex: 1; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px; font-size: var(--text-row); font-weight: 600; cursor: pointer; }
.role-tick__box { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }

.role-gives { display: grid; gap: 4px; font-size: var(--text-caption); line-height: 1.5; }

.role-gives__list { margin: 0; padding-left: 18px; }

.people-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.people-row__body { display: grid; gap: 2px; min-width: 0; }

.people-sheet__who { display: grid; gap: 1px; min-width: 0; }
.people-sheet__name { font-size: var(--text-row); font-weight: 600; }
.people-sheet__detail { overflow: hidden; color: var(--ink-2); font-size: var(--text-caption); text-overflow: ellipsis; }
.people-sheet__note { margin: 12px 0 0; color: var(--ink-2); font-size: var(--text-caption); }

.people-sheet__ticks { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-left: -8px; }
.people-sheet__ticks .role-tick__label { flex: none; }
.people-sheet__person .role-gives { padding: 12px 14px; border-radius: var(--radius-field); background: var(--sand); }

.tab-strip__tab { text-decoration: none; }
.tab-strip__tab[aria-current="page"] { color: var(--ink); }
.tab-strip__tab[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: var(--marker); }
.tab-strip__tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.tab-strip--sticky { position: sticky; top: var(--top-h); z-index: 5; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; padding: 0 var(--gutter); background: var(--page); }
.tab-strip--sticky .tab-strip__tab { flex: none; white-space: nowrap; }
.tab-strip--sticky::-webkit-scrollbar { display: none; }
.tab-strip--sticky .tab-strip__tab:focus-visible { outline-offset: -2px; }

.bubble-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: end; margin-top: 3px; }
.bubble-row--first { margin-top: 12px; }
.bubble-row__avatar { align-self: start; }
.bubble-row--mine { grid-template-columns: minmax(0, 1fr); justify-items: end; }
.bubble-row--dimmed .bubble { opacity: 0.6; }
.bubble-row__stack { display: grid; justify-items: start; gap: 4px; max-width: min(82%, 520px); }
.bubble-row--mine .bubble-row__stack { justify-items: end; }
.bubble { position: relative; display: grid; gap: 4px; padding: 8px 12px 7px; border-radius: 18px; background: var(--sand); color: var(--ink); font-size: var(--text-body); line-height: 1.38; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; -webkit-touch-callout: none; }

.bubble-row--mine .bubble { background: var(--primary); color: var(--on-primary); }
.bubble-row--mine.bubble-row--first .bubble { border-bottom-right-radius: 6px; }
.bubble__name { font-size: var(--text-caption); font-weight: 600; color: var(--ink-2); }
.bubble__name-note { font-weight: 400; color: var(--ink-3); }
.bubble__body { white-space: pre-wrap; }
.bubble__time { justify-self: end; font-size: var(--text-pill); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bubble-row--mine .bubble__time { color: color-mix(in srgb, var(--on-primary) 72%, transparent); }
.bubble--removed { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); font-style: italic; font-size: var(--text-caption); }
.bubble-row--mine .bubble--removed { background: transparent; color: var(--ink-3); }
.bubble-row--mine .bubble--removed .bubble__time { color: var(--ink-3); }

.editor-foot { position: sticky; bottom: -32px; z-index: 5; display: grid; gap: 10px; padding: 12px var(--gutter); border-top: 1px solid var(--line); background: var(--bar); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
.editor-foot__actions { display: flex; gap: 8px; }
.editor-foot__actions .btn--block { flex: 1 1 auto; min-width: 0; }
.editor-foot__actions > .save-bar--block { flex: 1 1 auto; min-width: 0; }
.editor-foot__actions .btn:not(.btn--block) { flex: none; }
.editor-foot__delete { justify-self: start; min-height: var(--touch); padding: 0; border: 0; background: none; color: var(--danger); font: inherit; font-size: var(--text-caption); font-weight: 600; cursor: pointer; }
.editor-foot--panel { position: sticky; bottom: 0; padding: 14px 16px 16px; background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
.media-file { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-caption); font-weight: 600; color: var(--ink-2); }

*, *::before, *::after { box-sizing: border-box; }

html { font-size: 17px; }

body {
    margin: 0;
    padding: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: var(--text-body);

}

::selection { background: color-mix(in srgb, var(--marker) 45%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

h1:focus { outline: none; }
h2 { font-size: var(--text-title); font-weight: 700; letter-spacing: -0.015em; }

.admin-shell {

    grid-template-columns: 248px minmax(0, 1fr);
    min-height: 100vh;
}

.admin-sidebar__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.module-nav { display: flex; flex: 1; flex-direction: column; gap: 18px; }

}

.module-nav__area-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 36px;
    padding: 0 10px;

    color: var(--on-masthead);

.module-nav__pages { margin-left: auto; color: var(--on-masthead-2); font-size: var(--text-pill); font-weight: 600; font-variant-numeric: tabular-nums; }
.module-nav__area-pages { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 2px 0 8px; }

.module-nav__problem { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0; padding: 8px 10px; border-radius: var(--radius-inner); background: var(--masthead-chip); color: var(--on-masthead); font-size: var(--text-caption); }

.module-nav__problem button:focus-visible { outline-color: var(--marker); }

.module-nav__row { position: relative; }

.module-nav__link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 0 34px 0 10px;
    border-radius: var(--radius-inner);
    color: var(--on-masthead-2);
    font-size: var(--text-label);
    font-weight: 600;
    text-decoration: none;
    transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out);
}

.module-nav__link:hover { background: color-mix(in srgb, var(--masthead-chip) 60%, transparent); color: var(--on-masthead); }
.module-nav__link.active { background: var(--masthead-chip); color: var(--on-masthead); }
.module-nav__link::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--marker);
    transform: scaleY(0);
    transition: transform 240ms var(--ease-out);
}
.module-nav__link.active::before { transform: scaleY(1); }
.module-nav__title { min-width: 0; padding: 8px 0; line-height: 1.3; overflow-wrap: anywhere; }

.module-nav__pin {
    position: absolute;
    top: 4px;
    right: 4px;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: var(--radius-inner);
    background: none;
    color: var(--on-masthead-2);
    cursor: pointer;
    opacity: 0;
    transition: opacity 120ms var(--ease-out), background-color 160ms var(--ease-out), color 160ms var(--ease-out);

.module-nav__row:is(:hover, :focus-within) .module-nav__pin { opacity: 1; }
@media (hover: none) {
    .module-nav__pin { opacity: 1; }
    .module-nav__pin--on { color: var(--on-masthead); }
}
.module-nav__pin:hover { background: var(--masthead-chip); color: var(--on-masthead); }
.module-nav__pin--on, .module-nav__pin--on:hover { color: var(--marker); }
.module-nav__pin--on .icon { fill: currentColor; }
.module-nav :is(.module-nav__link, .module-nav__jump, .module-nav__area-head, .module-nav__pin):focus-visible, .admin-menu:focus-visible { outline-color: var(--marker); }

.jump { display: grid; gap: 10px; }
.jump__field.search-field { max-width: none; flex: none; }
.jump__list { display: grid; gap: 2px; max-height: min(420px, 60vh); margin: 0; padding: 0; overflow-y: auto; list-style: none; }
.jump__option { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 10px; border-radius: var(--radius-inner); cursor: pointer; }

.jump__text { display: grid; min-width: 0; }

.jump__text span { overflow: hidden; color: var(--ink-2); font-size: var(--text-caption); text-overflow: ellipsis; white-space: nowrap; }
.jump__go { margin-left: auto; flex: none; color: var(--ink-3); }

@media (min-width: 720px) {
    .jump-layer .sheet { top: max(48px, 12vh); bottom: auto; transform: translateX(-50%); }
}

.admin-main {
    min-width: 0;
    padding: 28px 40px 64px;
}

.admin-main > :is(.workbench, .preview-window) { margin: -28px -40px -64px; }

.title-band {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 24px;

}

.title-band__text { display: grid; gap: 4px; min-width: 0; }
.title-band__back { display: inline-flex; align-items: center; gap: 2px; width: fit-content; margin: -6px 0 2px -4px; padding: 6px 4px; color: var(--accent); font-size: var(--text-label); font-weight: 600; text-decoration: none; }
.title-band__title { margin: 0; font-size: var(--text-headline); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
.title-band__title:focus { outline: none; }
.title-band__lead { margin: 0; max-width: 72ch; color: var(--ink-2); font-size: var(--text-caption); }
.title-band__actions { display: flex; flex-wrap: wrap; gap: 8px; }

.admin-gate { display: grid; max-width: 1440px; padding: 48px 0; border-radius: var(--radius); background: var(--sand); }

.office-columns { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px 48px; max-width: 1440px; }

.office-tasks, .office-areas { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.office-task, .office-area { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 0; border-bottom: 1px solid var(--line); }

.open-card { display: grid; gap: 12px; }
.open-card__place { display: flex; align-items: flex-start; gap: 12px; margin-top: 12px; }
.open-card__title { margin: 0; font-size: var(--text-title-lg); font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.open-card__title:focus { outline: none; }
.open-card__where { display: block; color: var(--ink-2); font-size: var(--text-caption); }
.open-card__body { max-width: 52ch; margin: 0; color: var(--ink-2); }

.person-page__lead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 0; color: var(--ink-2); font-size: var(--text-caption); }
.person-page__tab { margin-top: 24px; }
.person-page__account { max-width: 640px; }

.person-roles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); align-items: start; gap: 40px; max-width: 1280px; }
.person-roles__main { display: grid; gap: 12px; min-width: 0; }
.person-roles__features { columns: 2 280px; column-gap: 32px; }
.person-roles__feature { margin: 0 0 20px; break-inside: avoid; }
.person-roles__head { margin: 0 0 2px; padding: 0 8px; color: var(--ink-3); font-size: var(--text-pill); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.person-roles__feature .role-tick { border-bottom: 1px solid var(--line); border-radius: 0; }
.person-roles__one { padding-top: 18px; border-top: 1px solid var(--line); }
.person-roles__things { display: grid; margin: 0; padding: 0; list-style: none; }
.person-roles__things li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; min-height: 44px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.person-roles__why { position: sticky; top: 24px; padding: 20px 22px; border-radius: var(--radius); background: var(--sand); }
.person-roles__why-title { margin: 0 0 10px; font-size: var(--text-title); font-weight: 700; letter-spacing: -0.01em; }
.person-roles__given { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--sand-strong); color: var(--ink-2); font-size: var(--text-caption); }
@media (max-width: 1328px) {
    .person-roles { grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 28px; }
    .person-roles__features { columns: 1; }
}
@media (max-width: 680px) {
    .person-roles { grid-template-columns: minmax(0, 1fr); }
    .person-roles__why { position: static; }
}
