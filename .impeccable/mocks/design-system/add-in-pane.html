<h1>New opens where editing happens</h1><p class="sk-lead">New ministry puts a blank one at the top of the list, already chosen, and its fields open in the pane beside it, exactly where you'd change it later. Add the ministry keeps it there with its tabs. Cancel takes the blank away.</p>

hat it's for, in a sentence or two"></textarea></div></div><div class="sk-foot"><div class="sk-foot__row"><span class="grow"></span><p class="sk-status-line">Give it a name to add it.</p></div><div class="sk-foot__row"><span class="grow"></span><button class="btn btn--quiet" >Cancel</button><button class="btn btn--primary" disabled>Add the ministry</button></div></div></div></div></div></figure><figure class="sk-frame" style="width:460px"><figcaption>Step by step</figcaption><div class="sk-win" style="padding:20px 22px"><ol style="list-style:none;display:grid;gap:16px;font-size:var(--text-caption);color:var(--ink-2)"><li style="display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sand);color:var(--primary);font-weight:700;font-size:var(--text-caption)">1</span><span><b style="display:block;color:var(--ink);font-size:var(--text-row)">New ministry</b>In the title band, top right, as on every page.</span></li><li style="display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sand);color:var(--primary);font-weight:700;font-size:var(--text-caption)">2</span><span><b style="display:block;color:var(--ink);font-size:var(--text-row)">A blank one, chosen</b>It sits at the top of the list; the pane holds its fields.</span></li><li style="display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sand);color:var(--primary);font-weight:700;font-size:var(--text-caption)">3</span><span><b style="display:block;color:var(--ink);font-size:var(--text-row)">Add the ministry</b>It stays chosen and gains its tabs: About, People, Settings.</span></li><li style="display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start"><span
