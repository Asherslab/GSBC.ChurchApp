<h1>A short dialog first</h1><p class="sk-lead">New ministry asks only what it must know, in a small dialog: a name and what it is. Add opens the new one in its pane with everything else to fill in at your pace. The list never shows a half-made row.</p>

v class="sk-foot"><div class="sk-foot__row"><span class="grow"></span><button class="btn btn--primary" >Save</button></div></div></div></div></div></figure><figure class="sk-frame" style="width:460px"><figcaption>First: the dialog</figcaption><div class="sk-dialog-stage" style=""><div class="sk-dialog"><h3>New ministry</h3><p class="sheet__lead">Just its name for now. Everything else is in its pane once it's added.</p><div class="sk-dialog__body"><div class="field"><label class="field__label">Name</label><input class="field__input" value="Hospitality" placeholder=""></div><div class="field"><span class="field__label">What it is</span><div class="segmented" role="radiogroup"><button class="segmented__option" role="radio" aria-checked="true">A ministry</button><button class="segmented__option" role="radio" aria-checked="false">A Life Group</button></div></div></div><div class="sk-dialog__actions"><button class="btn btn--quiet" >Cancel</button><button class="btn btn--primary" >Add the ministry</button></div></div></div></figure><figure class="sk-frame" style=""><figcaption>The phone</figcaption><div class="sk-phone-wrap"><div class="sk-mini-phone"><div class="sk-status"><span>9:41</span><span></span></div>
