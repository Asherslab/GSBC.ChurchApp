<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Foot, primary first</title>

<body class="sk-board">
<h1>Foot, primary first</h1><p class="sk-lead">Today's order, made the same everywhere: the foot reads left to right as Save, then Cancel, with Delete pushed to the far right in red words. The status gets its own line above the buttons. Dialogs stack their buttons full width, the main one on top.</p>
<figure class="sk-frame" style="width:100%"><figcaption>A page: making something new</figcaption><div class="sk-win" style=""><header class="title-band"><div class="title-band__text"><h1 class="title-band__title">Sermon series</h1><p class="title-band__lead">Every series groups Sunday's sermons for the app, the website and the podcast.</p></div><div class="title-band__actions"><button class="btn btn--primary" ><i data-icon="plus"></i>New series</button><button class="btn btn--quiet" ><i data-icon="users-round"></i>Speakers</button></div></header></div></figure><div class="sk-row"><figure class="sk-frame" style=""><figcaption>A pane: changing what you picked</figcaption><div class="sk-win" style="width:640px"><div style="display:flex"><div class="sk-list" style="padding:18px 16px 0 22px;flex:0 0 200px"><div class="sk-pick on"><span class="sk-thumb" style="width:56px"></span><div><b>Easter 2027</b><span>6 sermons · from 28 Mar</span></div></div><div class="sk-pick"><span class="sk-thumb aqua"></span><div><b>Summer in the Psalms</b><span>8 sermons · Jan to Feb</span></div></div><div class="sk-pick"><span class="sk-thumb warm"></span><div><b>Advent 2026</b><span>4 sermons · Dec</span></div></div></div><div class="sk-pane" style=""><div class="sk-pane__head"><div style="flex:1;min-width:0"><h2>Easter 2027</h2><p>Sermon series · 6 sermons</p></div><button class="icon-btn" title="Close" style="color:var(--ink-2)"><i data-icon="x"></i></button></div><div class="sk-pane__body"><div class="field"><label class="field__label">Title</label><input class="field__input" value="Easter 2027" placeholder=""></div><div class="ui-pair" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="field"><label class="field__label">Starts</label><input class="field__input" value="Sun 28 Mar 2027" placeholder=""></div><div class="field"><label class="field__label">Sermons</label><input class="field__input" value="6 so far" placeholder=""></div></div><div class="field"><label class="field__label">About this series</label><textarea class="field__input field__input--multiline" placeholder="">Six weeks in Luke's account of the cross and the empty tomb.</textarea></div></div><div class="sk-foot"><p class="sk-status-line"><i data-icon="pencil"></i>You have changes that aren't saved</p><div class="sk-foot__row"><button class="btn btn--primary" >Save</button><button class="btn btn--quiet" >Cancel</button><span class="grow"></span><button class="sk-text-danger"><i data-icon="trash-2"></i>Delete this series…</button></div></div></div></div></div></figure><div style="display:grid;gap:22px"><figure class="sk-frame" style="width:460px"><figcaption>A dialog: a short form</figcaption><div class="sk-dialog-stage" style=""><div class="sk-dialog"><h3>Add a speaker</h3><p class="sheet__lead">They can be chosen for any sermon from now on.</p><div class="sk-dialog__body"><div class="field"><label class="field__label">Name</label><input class="field__input" value="" placeholder="Their first and last name"></div></div><div class="sk-dialog__actions sk-dialog__actions--stack"><button class="btn btn--primary btn--block" disabled>Add the speaker</button><p class="sk-status-line" style="justify-content:center">Give them a name to add them.</p><button class="btn btn--quiet btn--block" >Cancel</button></div></div></div></figure></div><figure class="sk-frame" style=""><figcaption>The phone</figcaption><div class="sk-phone-wrap"><div class="sk-mini-phone"><div class="sk-status"><span>9:41</span><span></span></div>
<div class="page-scroll"><header class="topbar topbar--solid"><div class="topbar__start"><button class="icon-btn icon-btn--back"><i data-icon="chevron-left" data-size="md"></i>Calendar</button></div><div class="topbar__title">This date</div><div class="topbar__end"></div></header>
<div class="page"><section class="section section--first"><p class="hint" style="margin:0 0 14px">A change to one Sunday. The others stay as they are.</p><div style="display:grid;gap:14px"><div class="field"><label class="field__label">Title</label><input class="field__input" value="Morning service" placeholder=""></div><div class="field"><label class="field__label">Starts</label><input class="field__input" value="10:30 am" placeholder=""></div><div class="field"><label class="field__label">Where</label><input class="field__input" value="Main auditorium" placeholder=""></div></div></section></div></div><div class="editor-foot"><p class="sk-status-line" style="justify-content:center"><i data-icon="pencil"></i>You have changes that aren't saved</p><button class="btn btn--primary btn--block" >Save this date</button><div class="editor-foot__actions"><button class="btn btn--quiet" >Not on this date</button><span style="flex:1"></span><button class="sk-text-danger"><i data-icon="trash-2"></i>Delete</button></div></div></div></div></figure></div>
<p class="sk-note">Sketch · sample names</p>
</body></html>
