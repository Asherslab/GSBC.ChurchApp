<h1>A status and a Move to menu</h1><p class="sk-lead">Where it is shows as a coloured status beside the title. Move to opens a short menu of every step, the current one ticked. It takes the least room and works for any number of steps, but you can't see what comes next without opening it.</p>
<div class="sk-row"><figure class="sk-frame" style=""><figcaption>The admin panel: Prayer</figcaption><div class="sk-win" style="width:780px"><div style=display:flex><div class="sk-list" style="padding:18px 16px 0 22px;flex:0 0 260px"><div class="sk-pick "><span class="row__icon row__icon--warm"><i data-icon="heart"></i></span><div><b>Surgery on Thursday</b><span>Sam Example · New</span></div></div><div class="sk-pick on"><span class="row__icon "><i data-icon="heart"></i></span><div><b>A new job in Toowong</b><span>Robin Sample · Followed up</span></div></div><div class="sk-pick "><span class="row__icon row__icon--quiet"><i data-icon="heart"></i></span><div><b>Mum's recovery</b><span>Casey Example · Answered</span></div></div><div class="sk-pick "><span class="row__icon row__icon--warm"><i data-icon="heart"></i></span><div><b>Exams next week</b><span>Taylor Sample · New</span></div></div></div><div class="sk-pane" style=""><div class="sk-pane__head"><div style="flex:1;min-width:0"><h2>A new job in Toowong</h2><p>From Robin Sample</p></div><div style="position:relative;display:flex;gap:6px;align-items:center"><span class="pill">Followed up</span><button class="btn btn--quiet btn--small">Move to<i data-icon="chevron-down"></i></button><div class="sk-menu" style="right:0;top:42px;min-width:220px"><button class=""><span class="sk-tick"></span><span>New</span></button><button class="is-active"><span class="sk-tick"><i data-icon="check"></i></span><span>Followed up</span></button><button class=""><span class="sk-tick"></span><span>Answered</span></button></div></div></div><div class="sk-pane__body"><p style="font-size:var(--text-lead);line-height:1.5;max-width:60ch">Please pray for Robin as they start a new job in Toowong next week. It's a big change after eight years.</p><p class="hint" style="margin:0">Sent Tue 10 Nov · the pastoral team reads it</p><div class="field"><span class="field__label">Notes for the pastoral team</span><textarea class="field__input field__input--multiline" placeholder="Only the pastoral team sees these">Called Robin on Wednesday; they'd love a visit.</textarea></div></div><div class="sk-foot"><div class="sk-foot__row"><button class="sk-text-danger"><i data-icon="trash-2"></i>Delete the request…</button><span class="grow"></span><button class="btn btn--primary" >Save the note</button></div></div></div></div></div></figure><figure class="sk-frame" style="width:300px"><figcaption>What changes</figcaption><div class="sk-win" style="padding:18px 20px;display:grid;gap:10px;font-size:var(--text-caption);color:var(--ink-2)"><p>The same status pill the lists use.</p><p>One extra press to move, and the steps ahead are hidden.</p><p>Fits any number of steps.</p></div></figure><figure class="sk-frame" style=""><figcaption>The phone: a prayer request</figcaption><div class="sk-phone-wrap"><div class="sk-mini-phone"><div class="sk-status"><span>9:41</span><span></span></div>
<div class="page-scroll"><header class="topbar topbar--solid"><div class="topbar__start"><button class="icon-btn icon-btn--back"><i data-icon="chevron-left" data-size="md"></i>To follow up</button></div><div class="topbar__title">Prayer request</div><div class="topbar__end"></div></header>
<div class="page"><section class="section section--first"><div style="display:grid;gap:14px"><div style="display:flex;gap:8px;align-items:center"><span class="pill">Followed up</span><span class="grow" style="flex:1"></span><button class="btn btn--quiet btn--small">Move to<i data-icon="chevron-down"></i></button></div><p style="font-size:var(--text-body);line-height:1.5">Please pray for Robin as they start a new job in Toowong next week. It's a big change after eight years.</p><p class="hint" style="margin:0">Sent Tue 10 Nov · the pastoral team reads it</p></div></section><section class="section "><div class="section__head"><h2 class="section__title">Notes</h2></div><div class="field"><textarea class="field__input field__input--multiline">Called Robin on Wednesday.</textarea></div></section></div></div></div></div></figure></div>
