<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Everything at the top</title>
<link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="parts.css"><script src="icons.js"></script><script src="kit.js"></script>
<style></style></head>
<body class="sk-board">
<h1>Everything at the top</h1><p class="sk-lead">Save and Cancel sit in the head of whatever you're changing, beside its title, the way the title band carries New. Delete and the rarer actions live in a ⋯ menu at the same top-right spot. Nothing waits at the foot.</p>
<figure class="sk-frame" style="width:100%"><figcaption>A page: making something new</figcaption><div class="sk-win" style=""><header class="title-band"><div class="title-band__text"><h1 class="title-band__title">Sermon series</h1><p class="title-band__lead">Every series groups Sunday's sermons for the app, the website and the podcast.</p></div><div class="title-band__actions"><button class="btn btn--quiet" ><i data-icon="users-round"></i>Speakers</button><button class="btn btn--primary" ><i data-icon="plus"></i>New series</button></div></header></div></figure><div class="sk-row"><figure class="sk-frame" style=""><figcaption>A pane: changing what you picked</figcaption><div class="sk-win" style="width:640px"><div style="display:flex"><div class="sk-list" style="padding:18px 16px 0 22px;flex:0 0 200px"><div class="sk-pick on"><span class="sk-thumb" style="width:56px"></span><div><b>Easter 2027</b><span>6 sermons · from 28 Mar</span></div></div><div class="sk-pick"><span class="sk-thumb aqua"></span><div><b>Summer in the Psalms</b><span>8 sermons · Jan to Feb</span></div></div><div class="sk-pick"><span class="sk-thumb warm"></span><div><b>Advent 2026</b><span>4 sermons · Dec</span></div></div></div><div class="sk-pane" style="min-height:640px"><div class="sk-pane__head"><div style="flex:1;min-width:0"><h2>Easter 2027</h2><p>Sermon series · 6 sermons</p></div><div style="display:flex;gap:6px;align-items:center;position:relative"><button class="btn btn--quiet btn--small" >Cancel</button><button class="btn btn--primary btn--small" >Save</button><button class="icon-btn" style="color:var(--ink-2)" title="More"><i data-icon="ellipsis"></i></button><div class="sk-menu" style="right:0;top:48px"><button><i data-icon="copy"></i>Copy this series</button><button><i data-icon="eye-off"></i>Hide from the app</button><hr><button class="danger"><i data-icon="trash-2"></i>Delete this series…</button></div></div></div><div class="sk-pane__body"><p class="sk-status-line"><i data-icon="pencil"></i>You have changes that aren't saved</p><div class="field"><label class="field__label">Title</label><input class="field__input" value="Easter 2027" placeholder=""></div><div class="ui-pair" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="field"><label class="field__label">Starts</label><input class="field__input" value="Sun 28 Mar 2027" placeholder=""></div><div class="field"><label class="field__label">Sermons</label><input class="field__input" value="6 so far" placeholder=""></div></div><div class="field"><label class="field__label">About this series</label><textarea class="field__input field__input--multiline" placeholder="">Six weeks in Luke's account of the cross and the empty tomb.</textarea></div></div></div></div></div></figure><div style="display:grid;gap:22px"><figure class="sk-frame" style="width:460px"><figcaption>A dialog: a short form</figcaption><div class="sk-dialog-stage"><div class="sk-dialog"><div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">Add a speaker</h3><button class="btn btn--quiet btn--small" >Cancel</button><button class="btn btn--primary btn--small" disabled>Add</button></div><p class="sheet__lead">They can be chosen for any sermon from now on.</p><div class="sk-dialog__body"><div class="field"><label class="field__label">Name</label><input class="field__input" value="" placeholder="Their first and last name"></div><p class="sk-status-line">Give them a name to add them.</p></div></div></div></figure></div><figure class="sk-frame" style=""><figcaption>The phone</figcaption><div class="sk-phone-wrap"><div class="sk-mini-phone"><div class="sk-status"><span>9:41</span><span></span></div>
<div class="page-scroll"><header class="topbar topbar--solid"><div class="topbar__start"><button class="topbar__text-btn" style="font-weight:500">Cancel</button></div><div class="topbar__title">This date</div><div class="topbar__end"><button class="topbar__text-btn">Save</button><button class="icon-btn" title="More"><i data-icon="ellipsis" data-size="md"></i></button></div></header>
<div class="sk-menu" style="right:10px;top:92px"><button><i data-icon="circle-off"></i>Not on this date</button><hr><button class="danger"><i data-icon="trash-2"></i>Delete this date</button></div><div class="page"><p class="sk-status-line" style="padding:14px 20px 0"><i data-icon="pencil"></i>You have changes that aren't saved</p><section class="section section--first"><p class="hint" style="margin:0 0 14px">A change to one Sunday. The others stay as they are.</p><div style="display:grid;gap:14px"><div class="field"><label class="field__label">Title</label><input class="field__input" value="Morning service" placeholder=""></div><div class="field"><label class="field__label">Starts</label><input class="field__input" value="10:30 am" placeholder=""></div><div class="field"><label class="field__label">Where</label><input class="field__input" value="Main auditorium" placeholder=""></div></div></section></div></div></div></div></figure></div>
<p class="sk-note">Sketch · sample names</p>
</body></html>
