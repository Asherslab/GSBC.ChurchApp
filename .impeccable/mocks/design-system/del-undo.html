<h1>Delete at once, with a way back</h1><p class="sk-lead">Nothing asks first. The thing goes straight away and a bar says what went, with Undo for ten seconds. It's quicker, and a slip costs nothing. Things that can't come back (a sent announcement, a message already read) still ask first.</p>
<div class="sk-row"><figure class="sk-frame" style=""><figcaption>The admin panel</figcaption><div class="sk-win" style="width:640px"><div style="display:flex;position:relative"><div class="sk-list" style="padding:18px 16px 0 22px;flex:0 0 200px"><div class="sk-pick "><span class="sk-thumb aqua"></span><div><b>Summer in the Psalms</b><span>8 sermons · Jan to Feb</span></div></div><div class="sk-pick "><span class="sk-thumb warm"></span><div><b>Advent 2026</b><span>4 sermons · Dec</span></div></div></div><div class="sk-pane"><div style="margin:auto;display:grid;justify-items:center;gap:8px;text-align:center;color:var(--ink-2)"><i data-icon="layers" data-size="lg"></i><b style="color:var(--ink)">Choose a series</b><span style="font-size:var(--text-caption)">Or make a new one.</span></div></div><div style="position:absolute;left:24px;right:24px;bottom:22px;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:14px;background:var(--ink);color:var(--page);box-shadow:0 18px 36px -16px rgb(0 0 0 / 0.5);font-size:var(--text-caption);font-weight:600"><i data-icon="trash-2"></i><span style="flex:1">Easter 2027 is deleted. Its 6 sermons stay, without a series.</span><button style="border:0;background:none;color:var(--page);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer">Undo</button><span style="opacity:.7;font-weight:500">8s</span></div></div></div></figure><figure class="sk-frame" style="width:460px"><figcaption>How it works</figcaption><div class="sk-win" style="padding:20px 22px;display:grid;gap:12px;font-size:var(--text-caption);color:var(--ink-2)"><b style="color:var(--ink);font-size:var(--text-row)">What it needs behind the scenes</b><p>Every delete keeps the thing for a short while so Undo can bring it back, on the phone and in the admin panel. That is new work on the server for each kind of thing.</p><p>Deleting a person's account stays a confirm: it can't be undone.</p></div></figure><figur
