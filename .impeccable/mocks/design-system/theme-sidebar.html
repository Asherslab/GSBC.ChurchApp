<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin light and dark: in the sidebar foot</title>
<link rel="stylesheet" href="kit.css"><script src="icons.js"></script><script src="kit.js"></script>
<style>.sk-mseg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; margin: 0 0 10px; border-radius: var(--radius-field); background: var(--masthead-chip); }
.sk-mseg button { min-width: 0; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 34px; border: 0; border-radius: var(--radius-inner); background: none; color: var(--on-masthead-2); font-size: var(--text-caption); font-weight: 600; }
.sk-mseg button[aria-checked="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--segment-shadow); }</style></head>
<body class="sk-admin" data-current="Home"><main><header class="title-band"><div class="title-band__text"><h1 class="title-band__title">Home</h1><p class="title-band__lead">What's on this week, and what needs you.</p></div></header>
<section class="section" style="padding:0;margin-top:8px;max-width:720px"><div class="section__head"><h2 class="section__title">Needs you</h2></div>
<div class="list"><div class="row"><span class="row__icon row__icon--warm"><i data-icon="heart"></i></span><span class="row__body"><span class="row__title">2 prayer requests to read</span><span class="row__subtitle">Sent since Sunday</span></span><i data-icon="chevron-right"></i></div>
<div class="row"><span class="row__icon"><i data-icon="calendar"></i></span><span class="row__body"><span class="row__title">Family games night needs a picture</span><span class="row__subtitle">Sun 15 Nov</span></span><i data-icon="chevron-right"></i></div>
<div class="row"><span class="row__icon"><i data-icon="users"></i></span><span class="row__body"><span class="row__title">3 people asked to join Production</span><span class="row__subtitle">Waiting for a leader</span></span><i data-icon="chevron-right"></i></div></div></section></main>
<script>document.addEventListener("DOMContentLoaded",()=>setTimeout(()=>{const foot=document.querySelector("[data-sk-foot]");foot.insertAdjacentHTML("afterbegin",`<div class="sk-mseg" role="radiogroup" aria-label="Light or dark"><button class="segmented__option" role="radio" aria-checked="true" title="Automatic"><i data-icon="sun-moon"></i>Auto</button><button class="segmented__option" role="radio" aria-checked="false" title="Light"><i data-icon="sun"></i>Light</button><button class="segmented__option" role="radio" aria-checked="false" title="Dark"><i data-icon="moon"></i>Dark</button></div>`);fillIcons(document);},0));</script></body></html>
