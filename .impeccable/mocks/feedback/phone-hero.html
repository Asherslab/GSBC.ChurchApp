<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><title>Send feedback: the screenshot leads</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--masthead:#2a3d5e;--note:#d5c9b7;--page:#fff;--sand:#f4efe7;--sand2:#e9e1d4;--ink:#18233a;--ink2:#4a5468;--ink3:#7d8596;--accent:#00776d;--marker:#e7ae74;--line:rgba(42,61,94,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--page);font-family:Montserrat,-apple-system,sans-serif;color:var(--ink);position:relative;font-size:16px}
.mast{background:var(--masthead);color:#fff;padding:54px 20px 22px;position:relative;overflow:hidden}
.mast .bar{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600;margin:-8px 0 22px -4px}
.mast .bar svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2}
.mast h1{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.02;max-width:9ch}
.mast p{color:var(--note);font-weight:600;font-size:14.5px;margin-top:10px;max-width:30ch}
.mast .ring{position:absolute;right:-60px;top:30px;width:210px;height:210px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
.sec{padding:22px 20px 0}
label,.lab{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.field{background:var(--sand);border-radius:14px;padding:13px 14px;font-size:16px;line-height:1.45;min-height:120px}
.ph{color:var(--ink3)}
.details{font-size:13.5px;color:var(--ink3);line-height:1.4;margin-top:12px;display:flex;gap:6px}
.details svg{flex:none;width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2;margin-top:1px}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:rgba(255,255,255,.92);border-top:1px solid var(--line)}
.btn{height:52px;border-radius:14px;background:var(--masthead);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:16px}
.thumb{border-radius:10px;background:linear-gradient(165deg,#dfe7f0 0 18%,#2a3d5e 18% 30%,#fff 30% 100%);box-shadow:0 0 0 1px var(--line);position:relative;flex:none}
.thumb.v{background:linear-gradient(165deg,#3b4a63,#18233a)}
.thumb.v::after{content:"0:14";position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 5px}
.add{border-radius:10px;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.add svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2}
.mast{padding-bottom:18px}.mast h1{font-size:34px;max-width:none}
.stage{display:flex;gap:10px;align-items:flex-end}
.big{width:150px;height:266px;border-radius:14px}
.strip{display:flex;flex-direction:column;gap:8px}
.strip .thumb{width:52px;height:92px}.strip .add{width:52px;height:52px}
.cap{font-size:13.5px;color:var(--ink2);margin-top:8px}
.field{min-height:96px}
</style></head><body>
<div class="mast"><div class="ring"></div><div class="bar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>More</div><h1>Send feedback</h1><p>Something broken or looking wrong? Show us.</p></div>
<div class="sec">
  <div class="stage"><div class="thumb big"></div><div class="strip"><div class="thumb v"></div><div class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div></div></div>
  <p class="cap">2 chosen · up to 6 pictures or videos</p>
</div>
<div class="sec" style="padding-top:16px">
  <label>What's wrong?</label>
  <div class="field">The Save button on the event page is cut off under the tab bar.</div>
  <p class="details"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h0"/></svg><span>Sent with it: app 1.4 (212), iPhone 15, iOS 18.1, from Events, and this phone's state.</span></p>
</div>
<div class="foot"><div class="btn">Send</div></div>
</body></html>
