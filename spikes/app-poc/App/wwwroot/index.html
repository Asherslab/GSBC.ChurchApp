<!DOCTYPE html>
<html lang="en-AU" data-theme="brand">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Good Shepherd</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#2a3d5e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Good Shepherd" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/montserrat-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/montserrat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/layout-today.css" />
    <link rel="stylesheet" href="css/layout-hub.css" />
    <link rel="stylesheet" href="css/layout-simple.css" />
    <link rel="stylesheet" href="css/layout-week.css" />
    <script>
        (() => {
            try {
                const theme = localStorage.getItem('gsbc:theme');
                const appearance = localStorage.getItem('gsbc:appearance');
                if (theme === 'Year2026') document.documentElement.dataset.theme = 'year';
                document.documentElement.dataset.layout = (localStorage.getItem('gsbc:layout') ?? 'Bulletin').toLowerCase();
                const dark = appearance === 'Dark' || (appearance !== 'Light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
            } catch { }
        })();
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <img class="boot-mark" src="img/gsbc-mark-white.svg" alt="" />
        </div>
    </div>
    <script src="js/capacitor.js"></script>
    <script src="js/native.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
