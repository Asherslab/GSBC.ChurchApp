server {
    listen 8080;
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/wasm application/rss+xml application/manifest+json;

    # Cloudflare keeps responses without Cache-Control at the edge for hours, so staff would see old builds.
    location ~* "^/_framework/.+\.[a-z0-9]{10}\.(wasm|js|dat|pdb)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
