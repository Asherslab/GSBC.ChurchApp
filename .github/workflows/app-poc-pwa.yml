# The design spike as a PWA at app.baptist.com.au, for staff to try before TestFlight. Delete this workflow
# with the spike. Each push builds an image and pins its tag in gsbc.argo; Argo CD rolls it out.
#
# The deploy job needs an ARGO_REPO_TOKEN secret with write access to asherslab/gsbc.argo.
name: App POC PWA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "spikes/app-poc/App/**"
      - "spikes/app-poc/pwa/**"
      - "spikes/app-poc/Directory.Build.props"
      - ".github/workflows/app-poc-pwa.yml"

concurrency:
  group: app-poc-pwa
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/asherslab/gsbc-churchapp-pwa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: spikes/app-poc
          file: spikes/app-poc/pwa/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for ARGO_REPO_TOKEN
        id: token
        env:
          ARGO_REPO_TOKEN: ${{ secrets.ARGO_REPO_TOKEN }}
        run: |
          if [[ -n "$ARGO_REPO_TOKEN" ]]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::ARGO_REPO_TOKEN is not set; the image was built but not deployed"; fi

      - name: Checkout gsbc.argo
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: asherslab/gsbc.argo
          path: argo
          token: ${{ secrets.ARGO_REPO_TOKEN }}

      - name: Pin the new image
        if: steps.token.outputs.present == 'true'
        working-directory: argo/clusters/mini/app/church-app-pwa
        run: |
          sed -i "s/newTag: .* #image/newTag: sha-${{ github.sha }} #image/" kustomization.yaml
          grep -q "newTag: sha-${{ github.sha }} #image" kustomization.yaml \
            || { echo "::error::kustomization.yaml has no '#image' line to rewrite"; exit 1; }

      - name: Commit and push (if changed)
        if: steps.token.outputs.present == 'true'
        working-directory: argo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git add clusters/mini/app/church-app-pwa/kustomization.yaml
            git commit -m "update church-app-pwa image to sha-${{ github.sha }}"
            git push
          else
            echo "no changes"
          fi
