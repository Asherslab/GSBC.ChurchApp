name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.impeccable/**"
      - "!spikes/**"
      - "!.run/**"
      - "docs/architecture/repo-layout.md"
      - "docs/architecture/architecture.svg"
      - "changelog/**"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.impeccable/**"
      - "!spikes/**"
      - "!.run/**"
      - "docs/architecture/repo-layout.md"
      - "docs/architecture/architecture.svg"
      - "changelog/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet workload install wasm-tools

      - run: dotnet build GSBC.ChurchApp.slnx

      - run: dotnet test --solution GSBC.ChurchApp.slnx --no-build

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet workload install wasm-tools

      - name: Publish the app (AOT) and check its warnings against the baseline
        run: tools/aot-warnings/check.sh

  data-layer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the native data layer's core
        working-directory: src/Hosts/App/native/data-layer
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=[x for r in json.load(sys.stdin)["devices"].values() for x in r if x["name"].startswith("iPhone")]; print(d[-1]["udid"])')
          xcodebuild test -scheme GsbcDataLayer -destination "id=$device"
