name: TestFlight (UAT)

on:
  workflow_dispatch:

concurrency:
  group: testflight-uat
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: uat
    permissions:
      contents: write
    env:
      SHELL_DIR: src/Hosts/App/shell
      ARCHIVE: ${{ github.workspace }}/out/App.xcarchive
      BUNDLE_ID: au.com.baptist.app.uat
      UAT_TAG: testflight/uat/${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet workload install wasm-tools

      - name: Write What to Test from the staff notes since the last TestFlight build
        run: |
          echo "MARKETING_VERSION=$(sed -n 's/^MARKETING_VERSION = //p' "$SHELL_DIR/ios/environments/Version.xcconfig")" >> "$GITHUB_ENV"
          tools/release-notes/what-to-test.sh > "$RUNNER_TEMP/what-to-test.txt"
          {
            echo "## What to Test"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/what-to-test.txt"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the app (Release, AOT, staff release notes) and check its warnings against the baseline
        env:
          GsbcReleaseNotes: staff
        run: tools/aot-warnings/check.sh

      - name: Sync the iOS shell
        working-directory: ${{ env.SHELL_DIR }}
        run: |
          npm ci --include=dev
          npx cap sync ios

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/asc/AuthKey.p8"
          mkdir -p "$(dirname "$key")"
          printf '%s' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive the UAT configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project "$SHELL_DIR/ios/App/App.xcodeproj" -scheme App -configuration UAT \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} of GSBC UAT. It appears in TestFlight once Apple has processed it."

      - name: Tag the uploaded commit, so the next build's notes start here
        run: |
          git tag "$UAT_TAG"
          git push origin "$UAT_TAG"

      - name: Set What to Test once Apple has processed the build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: dotnet run tools/release-notes/SetWhatToTest.cs -- "$BUNDLE_ID" "$MARKETING_VERSION" "${{ github.run_number }}" "$RUNNER_TEMP/what-to-test.txt"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc/AuthKey.p8"
